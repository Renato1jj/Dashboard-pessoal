
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f3f8;
            color: #252a41;
            display: flex;
        }

        .sidebar {
            width: 230px;
            min-height: 100vh;
            background: #20243a;
            color: white;
            padding: 30px 20px;
        }

        .sidebar h2 {
            margin-bottom: 40px;
            font-size: 22px;
        }

        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar a {
            color: #d6d9e8;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
        }

        .sidebar a:hover {
            background: #363c59;
            color: white;
        }

        main {
            flex: 1;
            padding: 35px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 20px;
        }

        header p {
            color: #777;
            margin-top: 8px;
        }

        #clock {
            font-weight: bold;
            color: #6558d3;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card, .panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000008;
        }

        .card p {
            font-size: 30px;
            color: #6558d3;
            font-weight: bold;
            margin-top: 15px;
        }

        .panel {
            margin-bottom: 25px;
        }

        .panel h2 {
            margin-bottom: 20px;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input, textarea {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font: inherit;
        }

        input {
            flex: 1;
            min-width: 0;
        }

        button {
            background: #6558d3;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #5043bd;
        }

        #taskList {
            list-style: none;
        }

        #taskList li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        #taskList li span {
            flex: 1;
            overflow-wrap: anywhere;
        }

        #taskList li.done span {
            text-decoration: line-through;
            color: #999;
        }

        #taskList li input[type="checkbox"] {
            flex: 0;
        }

        .delete {
            background: #e05252;
        }

        .delete:hover {
            background: #c63d3d;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            resize: vertical;
        }

        @media (max-width: 700px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-height: auto;
            }

            .sidebar h2 {
                margin-bottom: 15px;
            }

            .sidebar nav {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 5px;
            }

            main {
                padding: 20px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
            }

            form {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <h2>MyDashboard</h2>

        <nav>
            <a href="#inicio">Início</a>
            <a href="#tarefas">Tarefas</a>
            <a href="#metas">Metas</a>
            <a href="#notas">Anotações</a>
        </nav>
    </aside>

    <main>

        <header>
            <div>
                <h1>Meu Dashboard</h1>
                <p>Organize seu dia e acompanhe seus objetivos.</p>
            </div>

            <div id="clock"></div>
        </header>

        <section class="cards" id="inicio">

            <article class="card">
                <h3>Tarefas concluídas</h3>
                <p id="completed">0</p>
            </article>

            <article class="card">
                <h3>Tarefas pendentes</h3>
                <p id="pending">0</p>
            </article>

            <article class="card">
                <h3>Metas</h3>
                <p id="goals">3</p>
            </article>

        </section>

        <section class="panel" id="tarefas">

            <h2>Minhas tarefas</h2>

            <form id="taskForm">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Digite uma tarefa..."
                    required
                >

                <button type="submit">Adicionar</button>
            </form>

            <ul id="taskList"></ul>

        </section>

        <section class="panel" id="metas">

            <h2>Minhas metas</h2>

            <ul>
                <li>Estudar programação</li>
                <li>Ler um livro</li>
                <li>Praticar exercícios</li>
            </ul>

        </section>

        <section class="panel" id="notas">

            <h2>Anotações rápidas</h2>

            <textarea
                id="notes"
                placeholder="Escreva suas anotações..."
            ></textarea>

        </section>

    </main>

    <script>
        const taskForm = document.getElementById("taskForm");
        const taskInput = document.getElementById("taskInput");
        const taskList = document.getElementById("taskList");

        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

        function saveTasks() {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        function updateDashboard() {
            const completed = tasks.filter(task => task.done).length;
            const pending = tasks.length - completed;

            document.getElementById("completed").textContent = completed;
            document.getElementById("pending").textContent = pending;
        }

        function renderTasks() {
            taskList.innerHTML = "";

            tasks.forEach(task => {
                const li = document.createElement("li");

                if (task.done) {
                    li.classList.add("done");
                }

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = task.done;

                checkbox.addEventListener("change", () => {
                    task.done = checkbox.checked;
                    saveTasks();
                    renderTasks();
                });

                const span = document.createElement("span");
                span.textContent = task.text;

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "Excluir";
                deleteButton.classList.add("delete");

                deleteButton.addEventListener("click", () => {
                    tasks = tasks.filter(item => item.id !== task.id);
                    saveTasks();
                    renderTasks();
                });

                li.append(checkbox, span, deleteButton);
                taskList.appendChild(li);
            });

            updateDashboard();
        }

        taskForm.addEventListener("submit", event => {
            event.preventDefault();

            const text = taskInput.value.trim();

            if (!text) return;

            tasks.push({
                id: Date.now(),
                text: text,
                done: false
            });

            saveTasks();
            renderTasks();

            taskInput.value = "";
        });

        function updateClock() {
            const now = new Date();

            document.getElementById("clock").textContent =
                now.toLocaleString("pt-BR", {
                    dateStyle: "short",
                    timeStyle: "short"
                });
        }

        const notes = document.getElementById("notes");

        notes.value = localStorage.getItem("notes") || "";

        notes.addEventListener("input", () => {
            localStorage.setItem("notes", notes.value);
        });

        updateClock();
        setInterval(updateClock, 1000);

        renderTasks();
    </script>

</body>
</html>
